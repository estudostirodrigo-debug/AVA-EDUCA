<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA-EDUCA+</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <section>
        <h1>LOGIN</h1>
        <form id="formulario" action="">
         <label for="email"></label>
         <input type="email" name="email" id="email" required placeholder="Digite seu email cadastrado">
         <label for="senha"></label>
         <input type="password" name="senha" id="senha" required placeholder="Digite sua senha de acesso">
         <button id="acessar" type="submit">ACESSAR</button>
         <span id="mensagemErro"></span>
         <a href="#" id="resetarSenha">Resetar senha</a>
        </form>
    </section>
    <script src="./login.js" type="module" defer></script>
    
    
</body>
</html>

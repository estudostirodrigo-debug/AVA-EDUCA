<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVA-EDUCA+</title>
    <link rel="stylesheet" href="./cadastro-novo-aluno.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.31.0/moment.min.js"></script>
</head>

<body>

    <header>
    </header>

    <main>

        <h1>Novo Cadastro</h1>

        <form id="formCadastroAluno" action="">

            <section id="dados-pessoais">

                <h2>Dados Pessoais</h2>

                <div class="campo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" required minlength="4" maxlength="80"
                        placeholder="Digite seu nome completo">
                </div>

                <div class="campo">
                    <label for="genero">Gênero:</label>
                    <select name="genero" id="genero" required>
                        <option value="" selected>Selecione...</option>
                        <option value="masculino">Masculino</option>
                        <option value="feminino">Feminino</option>
                        <option value="lgbt">LGBT</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="dataNascimento">Data de Nascimento:</label>
                    <input type="text" id="dataNascimento" name="dataNascimento" required placeholder="DD/MM/YYYY">
                </div>

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input type="number" id="cpf" name="cpf" required placeholder="Digite seu CPF">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" required placeholder="(48) 0000-0202">
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required placeholder="Digite seu E-mail">
                </div>

            </section>

            <section id="endereço">

                <h2>Endereço</h2>

                <div class="campo">
                    <label for="cep">CEP:</label>
                    <input type="number" id="cep" name="cep" required placeholder="Digite seu CEP">
                </div>

                <div class="campo">
                    <label for="logradouro">Logradouro:</label>
                    <input type="text" id="logradouro" name="logradouro" required
                        placeholder="Digite seu logradouro (Rua...)">
                </div>

                <div class="campo">
                    <label for="numero">Número:</label>
                    <input type="number" id="numero" name="numero" required placeholder="Digite o número">
                </div>

                <div class="campo">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento" name="complemento" placeholder="Digite o complemento">
                </div>

                <div class="campo">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro" name="bairro" required placeholder="Digite seu bairro">
                </div>

                <div class="campo">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required placeholder="Digite sua cidade">
                </div>

                <div class="campo">
                    <label for="estado">Estado:</label>
                    <input type="text" id="estado" name="estado" required placeholder="Digite seu estado">
                </div>

            </section>

            <button type="submit">SALVAR</button>

        </form>

    </main>

    <script type="module" src="../cadastro-novo-aluno/cadastro-novo-aluno.js"></script>

</body>

</html>
